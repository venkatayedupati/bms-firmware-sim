name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: make sim
      - name: Run unit tests
        run: make test

  sanitize:
    # Linux only: TSan/ASan interceptor behavior for pthreads is most mature
    # there, and one consistent platform is enough to get sanitizer signal
    # without doubling flaky-CI surface area from a second OS's libc/runtime
    # quirks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer + AddressSanitizer/UBSan (sim + tests)
        run: make sanitize

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy and cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy cppcheck
      - name: clang-tidy
        run: make tidy CLANG_TIDY=clang-tidy
      - name: cppcheck
        run: make cppcheck-run

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's apt package is lcov 2.0-1, which has a real rendering
      # bug in `lcov --list`'s function-coverage percentage column (verified
      # directly: the underlying .info data's FNH/FNF counts were already
      # correct -- e.g. 6 hit / 6 found -- while --list rendered that same
      # data as "900%"). Installing 2.5 from source instead, matching the
      # Homebrew version already verified correct in local development.
      - name: Install lcov 2.5 from source (Ubuntu's apt lcov 2.0-1 has a known --list percentage bug)
        run: |
          curl -sL https://github.com/linux-test-project/lcov/releases/download/v2.5/lcov-2.5.tar.gz -o /tmp/lcov.tar.gz
          tar xzf /tmp/lcov.tar.gz -C /tmp
          sudo make -C /tmp/lcov-2.5 install
      - name: Run tests with coverage instrumentation and report
        run: make coverage
