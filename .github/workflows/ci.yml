name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: make sim
      - name: Run unit tests
        run: make test

  sanitize:
    # Linux only: TSan/ASan interceptor behavior for pthreads is most mature
    # there, and one consistent platform is enough to get sanitizer signal
    # without doubling flaky-CI surface area from a second OS's libc/runtime
    # quirks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer + AddressSanitizer/UBSan (sim + tests)
        run: make sanitize

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy and cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy cppcheck
      - name: clang-tidy
        run: make tidy CLANG_TIDY=clang-tidy
      - name: cppcheck
        run: make cppcheck-run
      # can_hal_socketcan.c isn't in SIM_SRCS (it's Linux-only, so `make
      # tidy`/`cppcheck-run` stay usable on macOS too), but this job is
      # always Linux, so it's the one place able to statically check it.
      - name: clang-tidy (SocketCAN backend, Linux-only file)
        run: clang-tidy src/can/can_hal_socketcan.c -- -std=c11 -Isrc
      - name: cppcheck (SocketCAN backend, Linux-only file)
        run: |
          cppcheck --enable=warning,performance,portability,style --std=c11 -Isrc \
            --suppress=missingIncludeSystem --inline-suppr --error-exitcode=1 \
            src/can/can_hal_socketcan.c

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's apt package is lcov 2.0-1, which has a real rendering
      # bug in `lcov --list`'s function-coverage percentage column (verified
      # directly: the underlying .info data's FNH/FNF counts were already
      # correct -- e.g. 6 hit / 6 found -- while --list rendered that same
      # data as "900%"). Installing 2.5 from source instead, matching the
      # Homebrew version already verified correct in local development.
      - name: Install lcov 2.5 from source (Ubuntu's apt lcov 2.0-1 has a known --list percentage bug)
        # Copying bin/+lib/ and wrapping with `perl -I lib` instead of
        # `make install`: the packaged install target also builds man pages
        # via sphinx-build (not present on the runner, not needed here).
        # These are lcov 2.x's actual (non-core-Perl) CPAN dependencies --
        # apt has them prepackaged as Debian modules (confirmed via
        # `apt-cache depends lcov`, since lcov's own release tarball
        # doesn't declare them anywhere convenient to introspect).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libcapture-tiny-perl libdatetime-perl libtimedate-perl \
            libjson-perl libperlio-gzip-perl
          curl -sL https://github.com/linux-test-project/lcov/releases/download/v2.5/lcov-2.5.tar.gz -o /tmp/lcov.tar.gz
          tar xzf /tmp/lcov.tar.gz -C /tmp
          sudo mkdir -p /usr/local/libexec/lcov
          sudo cp -r /tmp/lcov-2.5/bin /tmp/lcov-2.5/lib /usr/local/libexec/lcov/
          for f in lcov geninfo genhtml gendesc; do
            printf '#!/bin/bash\nexec perl -I/usr/local/libexec/lcov/lib /usr/local/libexec/lcov/bin/%s "$@"\n' "$f" \
              | sudo tee /usr/local/bin/$f > /dev/null
            sudo chmod +x /usr/local/bin/$f
          done
          lcov --version
      - name: Run tests with coverage instrumentation and report
        run: make coverage

  socketcan-build:
    # Compile/link verification only. Live functional testing against a
    # real vcan0 needs a genuine Linux machine or full VM -- verified
    # directly that neither Docker Desktop nor GitHub's hosted Linux
    # runner can provide one: Docker Desktop's kernel lacks the vcan
    # module outright (`modprobe vcan`: "Module vcan not found"), and
    # GitHub's hosted runner's kernel lacks it too, in a way that isn't
    # even a loadable-module gap -- `ip link add dev vcan0 type vcan`
    # itself fails there with "Unknown device type". See
    # docs/ARCHITECTURE.md "Portability" for how to test this yourself
    # against a real vcan0 if you have an environment that has one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the SocketCAN-backed simulator (compiles + links against real Linux CAN headers)
        run: make sim-socketcan
