name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: make sim
      - name: Run unit tests
        run: make test

  sanitize:
    # Linux only: TSan/ASan interceptor behavior for pthreads is most mature
    # there, and one consistent platform is enough to get sanitizer signal
    # without doubling flaky-CI surface area from a second OS's libc/runtime
    # quirks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer + AddressSanitizer/UBSan (sim + tests)
        run: make sanitize

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy and cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy cppcheck
      - name: clang-tidy
        run: make tidy CLANG_TIDY=clang-tidy
      - name: cppcheck
        run: make cppcheck-run

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov
      - name: gcc/gcov/lcov toolchain versions (debugging aid if coverage numbers ever look wrong)
        run: cc -dumpversion; gcov --version | head -1; lcov --version; ls /usr/bin/gcov* 2>/dev/null || true
      - name: Run tests with coverage instrumentation and report
        run: make coverage
      - name: Dump raw coverage.info for fault_manager.c (diagnosing bogus percentages)
        if: always()
        run: awk '/SF:.*fault_manager/,/end_of_record/' build-coverage/coverage.info | head -60
